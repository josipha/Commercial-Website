<!DOCTYPE html>
<html>
<head>
    <title>ShopEase - Products</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
        }
        header, footer {
            background: #172554;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav { margin-top: 15px; }
        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }
        h2 { text-align: center; margin-top: 30px; }
        .products {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 30px;
        }
        .product {
            background: white;
            width: 200px;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }
        .emoji { font-size: 60px; }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<header>
    <h1>ShopEase</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<h2>Our Products</h2>

<section class="products">
    <div class="product">
        <div class="emoji">👕</div>
        <h3>T-Shirt</h3>
        <p>Price: ₹499</p>
        <button onclick="buy('T-Shirt')">Buy Now</button>
    </div>
    <div class="product">
        <div class="emoji">👟</div>
        <h3>Shoes</h3>
        <p>Price: ₹999</p>
        <button onclick="buy('Shoes')">Buy Now</button>
    </div>
    <div class="product">
        <div class="emoji">🎒</div>
        <h3>Backpack</h3>
        <p>Price: ₹699</p>
        <button onclick="buy('Backpack')">Buy Now</button>
    </div>
    <div class="product">
        <div class="emoji">⌚</div>
        <h3>Watch</h3>
        <p>Price: ₹1299</p>
        <button onclick="buy('Watch')">Buy Now</button>
    </div>
</section>

<footer>
    <p>© 2026 ShopEase</p>
</footer>

<script>
    function buy(product) {
        alert("You selected: " + product);
    }
</script>
</body>
</html>
